name: Build and deploy app image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the target environment'
        required: true
        default: 'devl'
        type: choice
        options:
          - devl
          - prod
      operation:
        description: 'Select the Docker image operation to perform'
        required: true
        default: 'app-image'
        type: choice
        options:
          - app-image
          - app2-image
  # push:
  #   branches:
  #     - master
  #   paths:
  #     - 'app/**'
  #     - '.github/workflows/ecr.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  app-image:
    if: ${{  github.event.inputs.operation == 'app-image' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'devl' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::139023234293:role/InfraDeployerRole
          aws-region: ap-southeast-2
          

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push app image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sample-app-newrelic-devl
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" ./app
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Update ECS service
        env:
          AWS_REGION: ap-southeast-2
          CLUSTER: sample-app-NewRelic-devl
          SERVICE: sample-app-NewRelic-devl
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment --region "$AWS_REGION"

 